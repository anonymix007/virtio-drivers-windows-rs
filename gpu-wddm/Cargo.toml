[package]
name = "virtio-gpu-wddm-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
#arrayvec.workspace = true
bitflags.workspace = true
#crossbeam.workspace = true
crossbeam-queue.workspace = true
log.workspace = true
spin.workspace = true
virtio-drivers = { path = "../virtio-drivers", features = ["alloc"], default-features = false }
tagged = { path = "../proc/tagged" }
wdk = { path = "../wdk", features = ["dxgkrnl"] }
zerocopy.workspace = true
winresult.workspace = true
ida-rs.workspace = true
pin-init.workspace = true
microseh = { path = "../util/microseh", features = [], default-features = false }
offset-allocator = { path = "../util/offset-allocator" }
#sorted-vec = { path = "../util/sorted-vec" }
smallvec.workspace = true
hashbrown.workspace = true
modular-bitfield.workspace = true
itertools.workspace = true
#rcu_cell = { path = "../util/rcu_cell" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
uart_16550.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
arm-pl011-uart.workspace = true

[build-dependencies]
chrono.workspace = true
